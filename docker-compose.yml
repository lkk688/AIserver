services:
  vllm-qwen3:
    build:
      context: ./vllm-custom
    profiles: ["qwen", "llm", "all"]
    container_name: vllm-qwen3
    env_file:
      - .env
      - vllm_config.env
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - CUDA_LAUNCH_BLOCKING=1
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - VLLM_USE_V1=0
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8001:8000"
    ipc: host
    entrypoint: /bin/sh
    command:
      - -c
      - |
        exec python3 -m vllm.entrypoints.openai.api_server \
          --model $${QWEN_MODEL_NAME} \
          --host 0.0.0.0 \
          --port 8000 \
          --gpu-memory-utilization $${GPU_MEMORY_UTILIZATION} \
          --max-model-len $${MAX_MODEL_LEN} \
          --trust-remote-code \
          $${QUANTIZATION_ARG} \
          $${VLLM_EXTRA_ARGS}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vllm-olmocr:
    build:
      context: ./vllm-custom
    profiles: ["ocr", "all"]
    container_name: vllm-olmocr
    env_file:
      - .env
      - olmocr_config.env
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - CUDA_LAUNCH_BLOCKING=1
      - FLASHINFER_DISABLE_VERSION_CHECK=1
      - VLLM_USE_V1=0
      - OLMOCR_MODEL_NAME=allenai/olmOCR-2-7B-1025-FP8
      - OLMOCR_GPU_MEMORY_UTILIZATION=0.70
      - OLMOCR_MAX_MODEL_LEN=16384
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8002:8000"
    ipc: host
    entrypoint: /bin/sh
    command:
      - -c
      - |
        exec python3 -m vllm.entrypoints.openai.api_server \
          --model $${OLMOCR_MODEL_NAME} \
          --served-model-name $${OLMOCR_MODEL_NAME} \
          --host 0.0.0.0 \
          --port 8000 \
          --gpu-memory-utilization $${OLMOCR_GPU_MEMORY_UTILIZATION} \
          --max-model-len $${OLMOCR_MAX_MODEL_LEN} \
          --trust-remote-code
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


  embedding-tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9.1
    profiles: ["embedding", "rag", "all"]
    container_name: embedding-tei
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - ~/.cache/huggingface:/data
    ports:
      - "8081:80"
    shm_size: "1gb"
    command:
      - --model-id
      - ${EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["litellm", "gateway", "all"]
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "8"]
    restart: unless-stopped

  audio-cosyvoice:
    build: ./Audio/cosyvoice
    profiles: ["cosyvoice", "audio"]
    container_name: audio-cosyvoice
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - PYTHONPATH=/app/CosyVoice:/app/CosyVoice/third_party/Matcha-TTS
    volumes:
      - ~/.cache/modelscope:/root/.cache/modelscope
      - ./Audio/cosyvoice/CosyVoice:/app/CosyVoice
      - ./Audio/cosyvoice/pretrained_models:/app/pretrained_models
    ports:
      - "50000:50000"
    ipc: host
    entrypoint: ["python3", "server.py", "--port", "50000", "--model_dir", "pretrained_models/CosyVoice-300M-SFT"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  audio-vibevoice:
    build: ./Audio/vibevoice
    profiles: ["vibevoice", "audio"]
    container_name: audio-vibevoice
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./Audio/vibevoice/pretrained_models:/app/pretrained_models
    ports:
      - "50001:50000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: postgres:15-alpine
    profiles: ["infra", "db", "rag", "all"]
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_server_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: ["infra", "cache", "rag", "all"]
    container_name: redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    profiles: ["infra", "storage", "rag", "all"]
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./Worker
    profiles: ["worker", "rag", "all"]
    container_name: worker
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding-tei:80}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding-tei:
        condition: service_healthy
    volumes:
      - ./Worker:/app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data: