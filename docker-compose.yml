
services:
  vllm-qwen3:
    image: vllm/vllm-openai:latest
    profiles: ["qwen", "all"]
    container_name: vllm-qwen3
    env_file:
      - .env
      - vllm_config.env
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - CUDA_LAUNCH_BLOCKING=1
      # Select model to load: "gemma3", "translategemma", "medgemma", or "all"
      - MODEL_TYPE=${HFSERVE_MODEL_TYPE:-all}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8001:8000"
    ipc: host
    # Use variables from .env to control model version, context length, etc.
    # Note: QUANTIZATION is now conditionally applied. If empty, it's omitted.
    # But shell variable substitution doesn't easily support "omit if empty" in docker-compose command string directly without a script.
    # Workaround: We will use a shell entrypoint to construct the command dynamically.
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - |
        args="--model $${QWEN_MODEL_NAME} --host 0.0.0.0 --port 8000 --gpu-memory-utilization $${GPU_MEMORY_UTILIZATION} --max-model-len $${MAX_MODEL_LEN} --trust-remote-code $${VLLM_EXTRA_ARGS}"
        if [ -n "$${QUANTIZATION}" ]; then
          args="$$args --quantization $${QUANTIZATION}"
        fi
        echo "Running vLLM with args: $$args"
        exec python3 -m vllm.entrypoints.openai.api_server $$args
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["litellm", "all", "audio", "cosyvoice"]
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--num_workers", "8" ]

  vllm-qwen3-vl:
    image: vllm/vllm-openai:latest
    profiles: ["vl", "all"]
    container_name: vllm-qwen3-vl
    env_file:
      - .env
      - vllm_config.env
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8002:8000"
    ipc: host
    # Use variables from .env to control model version, context length, etc.
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - |
        args="--model $${QWEN_VL_MODEL_NAME} --host 0.0.0.0 --port 8000 --gpu-memory-utilization $${GPU_MEMORY_UTILIZATION_VL} --max-model-len $${MAX_MODEL_LEN} --trust-remote-code --dtype float16 $${VLLM_EXTRA_ARGS}"
        if [ -n "$${QUANTIZATION}" ]; then
          args="$$args --quantization $${QUANTIZATION}"
        fi
        echo "Running vLLM VL with args: $$args"
        exec python3 -m vllm.entrypoints.openai.api_server $$args
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  audio-cosyvoice:
    build: ./Audio/cosyvoice
    profiles: ["cosyvoice", "audio"]
    container_name: audio-cosyvoice
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - PYTHONPATH=/app/CosyVoice:/app/CosyVoice/third_party/Matcha-TTS
    volumes:
      - ~/.cache/modelscope:/root/.cache/modelscope
      - ./Audio/cosyvoice/CosyVoice:/app/CosyVoice
      - ./Audio/cosyvoice/pretrained_models:/app/pretrained_models
    ports:
      - "50000:50000"
    ipc: host
    entrypoint: ["python3", "server.py", "--port", "50000", "--model_dir", "pretrained_models/CosyVoice-300M-SFT"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  audio-vibevoice:
    build: ./Audio/vibevoice
    profiles: ["vibevoice", "audio"]
    container_name: audio-vibevoice
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./Audio/vibevoice/pretrained_models:/app/pretrained_models
    ports:
      - "50001:50000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_server_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./Worker
    container_name: worker
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./Worker:/app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

