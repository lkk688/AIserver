metadata_backend: sqlite
lexical_backend: fts5
vector_backend: faiss

storage:
  data_dir: ./data
  sqlite_path: ./data/metadata.db
  faiss_dir: ./data/faiss_index

ingestion:
  chunk_size_tokens: 512
  chunk_overlap_tokens: 50
  max_file_mb: 10

bookmarks:
  chrome_bookmarks_path: ~/.config/google-chrome/Default/Bookmarks

web_fetch:
  enabled: true
  timeout_sec: 10
  user_agent: "MyLocalSearch/0.1"

embedding:
  provider: "openai-compatible"
  base_url: "http://100.83.246.7:8002/v1"
  api_key: "embeddingp100"
  model_name: "Qwen/Qwen3-Embedding-0.6B"
  dim: 1024

text_processing:
  use_kenlm: true
  kenlm_model_path: ./data/wiki_en_dep.arpa.bin
  use_seq2seq: false
  seq2seq_model: google/byt5-small
  seq2seq_prefix: null

minio:
  endpoint: "http://100.83.246.7:9000"
  console_url: "http://100.83.246.7:9001"
  bucket: "aiagent"
  access_key: "my_minio_admin"
  secret_key: "my_minio_secret"
  secure: false
